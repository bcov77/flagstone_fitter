[project]
name = "flagstone-patio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlx>=0.32.4",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pyvoronoi>=1.2.8",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flagstone"]
